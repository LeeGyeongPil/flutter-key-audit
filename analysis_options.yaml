analyzer:
  exclude:
    - fka-demo/**
    - fka-aot/**
    - build/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: error

linter:
  rules:
    - prefer_final_locals
    - avoid_print
    - unawaited_futures
    - prefer_single_quotes
